name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Find buildozer.spec
        run: |
          find . -name "buildozer.spec" -type f
          BUILDOZER_DIR=$(dirname $(find . -name "buildozer.spec" -type f | head -1))
          echo "BUILDOZER_DIR=$BUILDOZER_DIR" >> $GITHUB_ENV
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip
          pip install buildozer
          pip install --upgrade git+https://github.com/kivy/python-for-android.git
      
      - name: Accept Android SDK licenses
        run: |
          cd ${{ env.BUILDOZER_DIR }}
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
      - name: Build APK
        run: |
          cd ${{ env.BUILDOZER_DIR }}
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
